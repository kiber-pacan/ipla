// VARIABLES
int version_index = Integer.valueOf(providers.gradleProperty("version_index").get())


architectury {
    common rootProject.platforms.split(",")
}

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    def impl_type = (version_index < 18) ? "modImplementation" : "implementation"

    add impl_type, "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    add impl_type, "maven.modrinth:architectury-api:$rootProject.architectury_api_version_fabric"
    add impl_type, "maven.modrinth:jade:${(rootProject.hasProperty("jade_version_fabric")) ? rootProject.jade_version_fabric : rootProject.jade_version}${((version_index < 5 || version_index == 6)) ? "" : "+fabric"}"


    implementation "com.electronwill.night-config:core:3.6.6"
    implementation "com.electronwill.night-config:toml:3.6.6"
}
