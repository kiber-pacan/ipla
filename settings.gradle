// region FUNCTIONS
// LINKS
String FABRIC_LOADER_VERSION_LINK = "https://meta.fabricmc.net/v2/versions/loader"

String FABRIC_API_VERSION_LINK = "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml"
String FORGE_VERSION_LINK = "https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml"
String NEOFORGE_VERSION_LINK = "https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml"
String PARCHMENT_BASE = "https://ldtteam.jfrog.io/artifactory/api/storage/parchmentmc-public/org/parchmentmc/data/"

static List<String> parse_xml_versioning(String link) {
    return new XmlSlurper().parseText(URI.create(link).toURL()
               .getText()).getAt("versioning").getAt("versions").getAt("version").collect() { it.text() }

}

def get_version = { String link ->
    return parse_xml_versioning(link).reverse().find {
        api -> (api as String).contains(minecraft_version)
    }
}

def get_mod_version = {
    String modid -> {
        var versions =
                new JsonSlurper().parseText(URI.create("https://api.modrinth.com/v2/project/${modid}/version").toURL().getText())

        return versions.find {version -> {
            version["game_versions"].contains(minecraft_version)
        }}["version_number"]
    }
}

// [fabric_version, fabric_version_name,
//  neoforge_version, neoforge_version_name,
//  forge_version, forge_version_name,
//  base_version_name]
def get_loader_dependent = {
    String modid -> {
        var versions =
                new JsonSlurper().parseText(URI.create("https://api.modrinth.com/v2/project/${modid}/version").toURL().getText())

        List<String> versions_loader_dependent = new ArrayList<>()

        List<String> loaders = ["fabric", "neoforge", "forge"]

        for (var loader : loaders) {
            var version_object = versions.find {version -> {
                version["game_versions"].contains(minecraft_version) && version["loaders"].contains(loader)
            }}

            versions_loader_dependent.add(modid.replace("-", "_") + "_version_" + loader)
            versions_loader_dependent.add((version_object != null) ? version_object["version_number"] as String : "")
        }
        String base = modid.replace("-", "_") + "_version"

        versions_loader_dependent.add(base)
        gradle.ext.get("loader_dependent").add(base)

        return versions_loader_dependent
    }
}

def add_loader_dependent = {
    String modid -> {
        List<String> versions = get_loader_dependent(modid)

        gradle.ext.set(versions[0], versions[1]) //modid_fabric = ver
        gradle.ext.set(versions[2], versions[3]) //modid_neoforge = ver
        gradle.ext.set(versions[4], versions[5]) //modid_forge = ver]
        //modid_versions = [fabric_ver, neoforge_ver, forge_ver]
        gradle.ext.set(versions[6] + "s", versions)

        gradle.ext.get("loader_dependent").add(versions[6])
    }
}

def add_loader_independent = {
    String modid -> {
        String version = modid.replace("-", "_") + "_version"

        gradle.ext.set(version, get_mod_version(modid))
        gradle.ext.get("loader_independent").add(version)
    }
}
