// region === PARCHMENT ===
var parchemnt_acceptable =
        new JsonSlurper().parseText(URI.create(PARCHMENT_BASE).toURL().getText())["children"]
                .collect {
                    it ->
                        {
                            String version = it["uri"]
                            return version.substring(11, version.size())
                        }
                }

static def resolve_parchment_version(def versions, def minecraft_version) {
    return versions.find { version ->
        !version.get("uri").contains("SNAPSHOT")
    }.get("uri") as String
}

if (parchemnt_acceptable.contains(minecraft_version)) {
    String parchment_version = resolve_parchment_version(
            new JsonSlurper().parseText(URI.create(PARCHMENT_BASE + "/parchment-" + minecraft_version).toURL().getText())["children"],
            minecraft_version
    )
    parchment_version = parchment_version.substring(1, parchment_version.size())

    gradle.ext.parchment_version = parchment_version
}
