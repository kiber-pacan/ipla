pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        maven { url = 'https://maven.maxhenkel.de/repository/public' }
        gradlePluginPortal()
    }
    // For versions <= than 1.19.4 use 1.13 version of architectury loom to stop forge from crying
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'dev.architectury.loom') {
                useVersion(((Integer.valueOf(index) <= 4) ? "1.13-SNAPSHOT" : "1.17-SNAPSHOT"))
            }
        }
    }
}

rootProject.name = 'ipla'

// Create build.properties file for preprocessor
def writeBuildGradlePredefine(List<String> mc_versions, int version) {
    StringBuilder sb = new StringBuilder()
    for (int i = 0; i < mc_versions.size(); i++) {
        String verStr = mc_versions[i].replace(".", "_")
        sb.append("V" + verStr + "=" + i.toString() + "\n")

        if (version == i)
            sb.append("MC_VER=" + i.toString() + "\n")
    }

    sb.append("LOADER=0\n")

    sb.append("COMMON=0\n")
    sb.append("FABRIC=1\n")
    sb.append("NEOFORGE=2\n")
    sb.append("FORGE=3\n")

    new File(rootDir, "build.properties").text = sb.toString()
}

// Get minecraft version index
int version
if (hasProperty("index")) {
    version = Integer.valueOf(index)
} else {
    version = 0
}

def mc_versions = [
        "1.16.5",  // 0
        "1.17.1",  // 1
        "1.18.2",  // 2
        "1.19.2",  // 3
        "1.19.4",  // 4
        "1.20.1",  // 5
        "1.20.4",  // 6
        "1.21",    // 7
        "1.21.1",  // 8
        "1.21.3",  // 9
        "1.21.4",  // 10
        "1.21.5",  // 11
        "1.21.6",  // 12
        "1.21.7",  // 13
        "1.21.8",  // 14
        "1.21.9",  // 15
        "1.21.10", // 16
        "1.21.11", // 17
        "26.1",    // 18
        "26.1.1",  // 19
        "26.1.2",  // 20
        "26.2",    // 21
]

println("version: ${version}-${mc_versions[version]}")

writeBuildGradlePredefine(mc_versions, version)

// Loading properties
def props = new Properties()
props.load(new FileInputStream("${rootDir}/versions/${mc_versions.get(version)}.properties"))

props.each { prop ->
    //if (prop.key != null && prop.value != null)
    gradle.ext.set(prop.key, prop.value)
}

// Including platforms
include "common"

def platforms = props.enabled_platforms.split(",")
for (platform in platforms) {
    include platform
}
