// Create build.properties file for preprocessor
def write_gradle_predefine(List<String> minecraft_versions, int version) {
    StringBuilder sb = new StringBuilder()
    for (int i = 0; i < minecraft_versions.size(); i++) {
        String verStr = minecraft_versions[i].replace(".", "_")
        sb.append("V" + verStr + "=" + i.toString() + "\n")

        if (version == i)
            sb.append("MC_VER=" + i.toString() + "\n")
    }

    sb.append("LOADER=0\n")

    sb.append("COMMON=0\n")
    sb.append("FABRIC=1\n")
    sb.append("NEOFORGE=2\n")
    sb.append("FORGE=3\n")

    new File(rootDir, "build.properties").text = sb.toString()
}

