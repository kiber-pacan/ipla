plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        url "https://maven.nucleoid.xyz/"
        name "Nucleoid"
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
}
int version_index = Integer.valueOf(rootProject.index)

dependencies {
    def impl_type = (version_index < 18) ? "modImplementation" : "implementation"

    add impl_type, "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    add impl_type, "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    add impl_type, "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    add impl_type, "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    add impl_type, "maven.modrinth:jade:${(rootProject.hasProperty("jade_version_fabric")) ? rootProject.jade_version_fabric : rootProject.jade_version}${((version_index < 5 || version_index == 6)) ? "" : "+fabric"}"

    if (version_index < 18)
        common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    else
        common(project(path: ':common')) { transitive false }


    implementation "com.electronwill.night-config:core:3.6.6"
    shadowBundle "com.electronwill.night-config:core:3.6.6"

    implementation "com.electronwill.night-config:toml:3.6.6"
    shadowBundle "com.electronwill.night-config:toml:3.6.6"

    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    if (version_index < 18) {
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = 'dev-shadow'
    } else {
        configurations = [project.configurations.shadowBundle]

        from(sourceSets.main.output.classesDirs)
        from(sourceSets.main.output.resourcesDir)

        archiveClassifier = ""
    }
}

if (version_index < 18) {
    remapJar {
        inputFile.set shadowJar.archiveFile
    }
} else {
    jar {
        archiveClassifier.set("dev")
    }
    shadowJar {
        archiveClassifier.set("")
    }
    assemble {
        dependsOn("shadowJar")
    }
}
