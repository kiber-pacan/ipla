import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id "dev.architectury.loom" version "1.17-SNAPSHOT" apply false
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "com.gradleup.shadow" version "8.3.6" apply false

    id "systems.manifold.manifold-gradle-plugin" version "0.0.2-alpha"

    id "com.modrinth.minotaur" version "2.+" apply false
    id "net.darkhax.curseforgegradle" version "1.3.33" apply false
}


project.gradle.ext.getProperties().each { prop ->
    if (prop.key != null && prop.value != null)
        rootProject.ext.set(prop.key, prop.value)
}


architectury {
    minecraft = project.minecraft_version
}


base {
    archivesName = rootProject.archives_name
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"


    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url "https://maven.shedaniel.me/" }
        maven { url = 'https://maven.architectury.dev/' }
    }

    def loaders = [
            "common" : 0,
            "fabric" : 1,
            "neoforge" : 2,
            "forge" : 3
    ]

    def taskNames = gradle.startParameter.taskNames
    def loader = "common"

    if (!taskNames.isEmpty()) {
        def firstTask = taskNames[0]
        def parts = firstTask.split(':')
        if (parts.size() > 1) {
            loader = parts[1]
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ["-ALOADER=${loaders[loader]}"]
    }
}

subprojects {
    if (Integer.valueOf(index) < 18) {
        apply plugin: 'dev.architectury.loom'
    } else {
        apply plugin: 'dev.architectury.loom-no-remap'
    }

    apply plugin: "systems.manifold.manifold-gradle-plugin"

    apply plugin: "net.darkhax.curseforgegradle"
    apply plugin: "com.modrinth.minotaur"

    base {
        archivesName = "$rootProject.archives_name-mc$project.minecraft_version-$project.name"
    }

    configurations {
        testImplementation.extendsFrom annotationProcessor
    }

    loom {
        if (Integer.valueOf(index) < 18) {
            silentMojangMappingsLicense()
        }
    }

    java {
        withSourcesJar()

        toolchain {
            vendor = JvmVendorSpec.ADOPTIUM
            languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
        }
    }

    processResources {
        def replaceProperties = [
                mod_version : project.mod_version,
                minecraft_version : project.minecraft_version,
                fabric_loader_version : project.fabric_loader_version,
                architectury_api_version : project.architectury_api_version,
                java : project.java_version,
                name : "Ipla",
                modid : project.archives_name,
                description : "Mod that lets you place items on any block side",
                authors : "akicater",
                license : "MIT",
                sources : "https://github.com/kiber-pacan/ipla"
        ]

        if (rootProject.hasProperty("forge_version")) {
            replaceProperties.put("forge_loader_version", project.forge_version)
        }
        if (rootProject.hasProperty("neoforge_version")) {
            replaceProperties.put("neoforge_loader_version", project.neoforge_version)
        }
        if (rootProject.hasProperty("yacl_version")) {
            replaceProperties.put("yacl_version", project.yacl_version)
        }
        if (rootProject.hasProperty("midnightlib_version")) {
            replaceProperties.put("midnightlib_version", project.midnightlib_version)
        }

        def files = ["fabric.mod.json", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "quilt.mod.json"]
        inputs.properties replaceProperties

        filesMatching(files) {
            replaceProperties.eachWithIndex {
                expand(replaceProperties) { replaceProperties }
            }
        }
    }

    dependencies {
        annotationProcessor("systems.manifold:manifold-preprocessor:${manifold_version}")
        testAnnotationProcessor("systems.manifold:manifold-preprocessor:${manifold_version}")

        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"

        if (Integer.valueOf(index) < 18) {
            mappings loom.layered() {
                officialMojangMappings()
                parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment}@zip")
            }
        }
    }

    def loader = project.name

    def credentials = new Properties()
    if (new File("${rootDir}/credentials.properties").exists()) {
        credentials.load(new FileInputStream("${rootDir}/credentials.properties"))
    }

    if (loader != "common") {
        modrinth {
            token = credentials.getProperty("modrinthToken")
            projectId = "ipla"
            versionName = archives_name + " " + mod_version
            versionNumber = mod_version
            versionType = "release"
            uploadFile = (Integer.valueOf(index) < 18) ? remapJar : jar
            gameVersions = [rootProject.minecraft_version]
            loaders = [loader]
            changelog = file("CHANGELOG.md").toString()
            dependencies {
                if (loader.equals("fabric")) {
                    required.project "fabric-api"
                    required.project "modmenu"
                    required.project "architectury-api"
                } else if (loader.equals("forge") || loader.equals("neoforge")) {
                    required.project "architectury-api"
                }
            }
            failSilently = true
        }

        // ==== Новый плагин CurseForgeGradle ====
        tasks.register("publishCurseForge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
            disableVersionDetection()

            def token = credentials.getProperty("curseToken")
            if (token == null || token.isEmpty()) {
                logger.warn("WARNING: CurseForge token is missing!")
            }
            apiToken = token ?: ""

            def uploadFile = (Integer.valueOf(index) < 18) ? tasks.named("remapJar") : tasks.named("jar")
            def mainFile = upload("1124962", uploadFile)

            mainFile.displayName = archives_name + " " + mod_version
            mainFile.releaseType = "release"

            mainFile.changelog = ""
            mainFile.changelogType = "markdown"

            def targetMcVersion = rootProject.minecraft_version
            def targetLoader = (loader == "neoforge") ? "NeoForge" : loader.capitalize()

            mainFile.addGameVersion(targetMcVersion)
            mainFile.addModLoader(targetLoader)

            // На версии 1.3.33 этот метод работает штатно
            mainFile.addEnvironment("Client", "server")

            if (loader.equals("fabric")) {
                mainFile.addRequirement("fabric-api", "modmenu", "architectury-api")
            } else if (loader.equals("forge") || loader.equals("neoforge")) {
                mainFile.addRequirement("architectury-api")
            }
        }
    }
}